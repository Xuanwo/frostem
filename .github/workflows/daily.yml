name: daily-upstream

on:
  schedule:
    # Once per day (UTC). Policy: detect HEAD once daily; publish when it moved.
    # Version bump lives in scripts/sync_from_snowball.py (algorithms/ gate).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if upstream pin already matches HEAD (initial release)"
        type: boolean
        default: false

# contents: push sync commits/tags; id-token: crates.io Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-semver-checks

      - name: Read current upstream pin and previous release
        id: pin
        run: |
          if [[ -f upstream-pin.toml ]]; then
            echo "commit=$(sed -n 's/^commit = \"\([^\"]*\)\"/\1/p' upstream-pin.toml)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=" >> "$GITHUB_OUTPUT"
          fi
          # Previous crate version / tag (before this sync rewrites Cargo.toml).
          prev_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "version=${prev_version}" >> "$GITHUB_OUTPUT"
          if [[ -n "$prev_version" ]] && git rev-parse "v${prev_version}" >/dev/null 2>&1; then
            echo "tag=v${prev_version}" >> "$GITHUB_OUTPUT"
          else
            # Fall back to latest v* tag on this branch, if any.
            prev_tag=$(git tag -l 'v*' --sort=-version:refname | head -1 || true)
            echo "tag=${prev_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve snowball main HEAD
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/snowballstem/snowball.git refs/heads/main | awk '{print $1}')
          if [[ -z "$sha" ]]; then
            echo "failed to resolve upstream main" >&2
            exit 1
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream main HEAD: $sha"

      - name: Detect upstream change
        id: changed
        run: |
          new="${{ steps.upstream.outputs.commit }}"
          old="${{ steps.pin.outputs.commit }}"
          force="${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}"
          if [[ "$force" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Force publish requested for $new"
          elif [[ -n "$old" && "$old" == "$new" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream HEAD unchanged ($new); nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream moved: ${old:-<none>} -> $new"
          fi

      - name: Sync from snowball main
        if: steps.changed.outputs.changed == 'true'
        run: python3 scripts/sync_from_snowball.py

      - name: Decide version (semver-checks + collision; algorithms gate is in sync script)
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail

          # sync_from_snowball.py already applied the algorithms/ gate.
          major=$(sed -n 's/^version = "\([0-9]*\)\..*/\1/p' Cargo.toml)
          minor=$(sed -n 's/^version = "[0-9]*\.\([0-9]*\)\..*/\1/p' Cargo.toml)
          patch=$(sed -n 's/^version = "[0-9]*\.[0-9]*\.\([0-9]*\)"/\1/p' Cargo.toml)
          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "failed to parse version from Cargo.toml after sync" >&2
            exit 1
          fi

          # Keep CI logs out of the repo working tree (avoid dirty publish / accidental commit).
          semver_out="${RUNNER_TEMP}/semver.out"
          semver_err="${RUNNER_TEMP}/semver.err"

          set +e
          cargo semver-checks check-release >"$semver_out" 2>"$semver_err"
          rc=$?
          set -e
          cat "$semver_out" || true
          cat "$semver_err" || true

          rewrite=false
          if [[ $rc -ne 0 ]]; then
            if grep -qiE \
              'not been published|could not|no crate|404|failed to|unable to|does not exist|never published|not found' \
              "$semver_err" "$semver_out"; then
              echo "semver-checks: no usable baseline; keeping major=$major"
            else
              echo "semver-checks reported API break; bumping major"
              major=$((major + 1))
              rewrite=true
            fi
          else
            echo "semver-checks: no breaking changes"
          fi

          version="${major}.${minor}.${patch}"

          # Tag / crates.io collision → bump patch further.
          while git rev-parse "v${version}" >/dev/null 2>&1; do
            patch=$((patch + 1))
            version="${major}.${minor}.${patch}"
            rewrite=true
          done

          if command -v curl >/dev/null; then
            while curl -fsSL -A "frostem-ci" \
              "https://crates.io/api/v1/crates/frostem/${version}" >/dev/null 2>&1; do
              patch=$((patch + 1))
              version="${major}.${minor}.${patch}"
              rewrite=true
            done
          fi

          if [[ "$rewrite" == "true" ]]; then
            # Pin is already at HEAD; pass explicit components so the gate is not re-applied.
            python3 scripts/sync_from_snowball.py --skip-build --snowball-dir .snowball-src \
              --major "$major" --minor "$minor" --patch "$patch"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Test
        if: steps.changed.outputs.changed == 'true'
        run: cargo test

      - name: Commit, push, and create GitHub Release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes after sync (unexpected if commit moved)."
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          git commit -m "chore: sync snowball ${{ steps.upstream.outputs.commit }}"
          git push

          # Release notes are generated for the GitHub Release body only (not a repo file).
          notes="${RUNNER_TEMP}/release-notes.md"
          python3 scripts/generate_release_notes.py \
            --version "$version" \
            --old-upstream "${{ steps.pin.outputs.commit }}" \
            --new-upstream "${{ steps.upstream.outputs.commit }}" \
            --snowball-dir .snowball-src \
            --previous-tag "${{ steps.pin.outputs.tag }}" \
            --previous-version "${{ steps.pin.outputs.version }}" \
            >"$notes"
          cat "$notes"

          # Creates the annotated tag and GitHub Release together (no bare git tag push).
          gh release create "v${version}" \
            --title "frostem ${version}" \
            --notes-file "$notes" \
            --target "$(git rev-parse HEAD)"

      # Trusted Publishing: short-lived token via OIDC (no CARGO_REGISTRY_TOKEN secret).
      # Requires a Trusted Publisher on crates.io for this repo + workflow file daily.yml.
      # See README "Trusted Publishing".
      - name: Authenticate with crates.io
        if: steps.changed.outputs.changed == 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      # Drop the temporary snowball checkout before publish. cargo publish refuses a dirty
      # tree; nested .snowball-src can leave uncommitted files that fail packaging.
      - name: Publish to crates.io
        if: steps.changed.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          rm -rf .snowball-src
          cargo publish
